<html>
<head>

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="reuma_nutri_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>reuma_nutri_app</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/pica@9.0.1/dist/pica.min.js"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 5px;
      border: 2px solid #e2e8f0;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0171bb;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Limpieza automatica de Service Workers y caches obsoletas
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    // Interpolador de desplazamiento suave (Smooth Scrolling) para Flutter Web
    (function() {
      let targetDeltaY = 0;
      let targetDeltaX = 0;
      let isAnimating = false;
      let currentTarget = null;
      let clientX = 0;
      let clientY = 0;

      window.addEventListener('wheel', function(e) {
        if (e.__isSmooth) return;

        e.preventDefault();
        e.stopImmediatePropagation();

        targetDeltaY += e.deltaY;
        targetDeltaX += e.deltaX;
        currentTarget = e.target;
        clientX = e.clientX;
        clientY = e.clientY;

        if (!isAnimating) {
          isAnimating = true;
          requestAnimationFrame(step);
        }
      }, { capture: true, passive: false });

      function step() {
        if (Math.abs(targetDeltaY) < 0.5 && Math.abs(targetDeltaX) < 0.5) {
          targetDeltaY = 0;
          targetDeltaX = 0;
          isAnimating = false;
          return;
        }

        const stepY = targetDeltaY * 0.18;
        const stepX = targetDeltaX * 0.18;

        targetDeltaY -= stepY;
        targetDeltaX -= stepX;

        if (currentTarget) {
          const smoothEvent = new WheelEvent('wheel', {
            deltaX: stepX,
            deltaY: stepY,
            deltaMode: 0,
            clientX: clientX,
            clientY: clientY,
            bubbles: true,
            cancelable: true,
            view: window
          });
          smoothEvent.__isSmooth = true;
          currentTarget.dispatchEvent(smoothEvent);
        }

        requestAnimationFrame(step);
      }
    })();
  </script>
</body>
</html>
