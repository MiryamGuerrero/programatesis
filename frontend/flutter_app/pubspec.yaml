name: reuma_nutri_app
description: Base multimodal para soporte nutricional clinico pediatrico
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.0
  dio: 5.8.0+1
  http: ^1.2.2
  intl: ^0.20.0
  google_fonts: ^6.2.1
  fl_chart: ^1.2.0
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.2.0
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo 1.png
    - assets/images/logo sin.png
    - assets/images/
